name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: Run every gate but stop short of publishing
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: publish ${{ github.ref_name }}
    runs-on: ubuntu-latest
    env:
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The "tag is on main" check below needs history, not a shallow clone.
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          registry-url: https://registry.npmjs.org

      # A dry run reaches `npm publish --dry-run`, which needs no credential, so
      # the gate can be rehearsed before the secret exists.
      - name: Require the NPM_TOKEN secret
        if: env.DRY_RUN != 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::secret NPM_TOKEN is not set. A repository admin must add it before a release can publish."
            exit 1
          fi

      - name: Require the tag to point at a commit on main
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::${GITHUB_REF_NAME} points at ${GITHUB_SHA}, which is not on main."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Packaging guard
        run: npx vitest run test/integration/packaging.test.ts

      - name: Test
        run: npm test

      - name: Require the tag, package.json and uxd version to agree
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p 'require("./package.json").version')"
          cli="$(node dist/bin/uxd.js version)"
          echo "tag=${tag} package.json=${pkg} cli=${cli}"
          if [ "$tag" != "$pkg" ] || [ "$cli" != "uxd ${tag}" ]; then
            echo "::error::version mismatch — tag '${tag}', package.json '${pkg}', CLI '${cli}'"
            exit 1
          fi

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            npm publish --access public --dry-run
          else
            npm publish --access public --provenance
          fi
